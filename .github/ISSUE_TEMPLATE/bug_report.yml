name: Bug report
description: Report a reproducible problem in INFERNEX
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, tokens, personal data, private keys, or real target information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a local test or authorized lab environment only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: INFERNEX version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact sensitive values before posting.
