<text x="118" y="274" fill="#ff8246" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="6">NATIVE CYBERSECURITY PLATFORM</text>
<text x="118" y="330" fill="#d7c4c1" font-family="Arial,sans-serif" font-size="20" letter-spacing="2">ONE TERMINAL. INDEPENDENT ENGINES. BUILT IN RUST.</text>
