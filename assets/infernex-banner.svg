<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">INFERNEX native cybersecurity platform banner</title><desc id="desc">A dark crimson and orange portal-inspired banner for the INFERNEX all-in-one native security terminal.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09070b"/><stop offset=".55" stop-color="#210b14"/><stop offset="1" stop-color="#10080c"/></linearGradient>
 <linearGradient id="fire" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ff3c27"/><stop offset=".55" stop-color="#ff7625"/><stop offset="1" stop-color="#ff3155"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="520" fill="url(#base)"/>
<circle cx="1260" cy="250" r="220" fill="#f23c28" opacity=".14" filter="url(#blur)"/>
<circle cx="1260" cy="250" r="170" fill="none" stroke="url(#fire)" stroke-width="18" filter="url(#glow)"/>
<circle cx="1260" cy="250" r="136" fill="none" stroke="#ff9b44" stroke-width="3" stroke-dasharray="6 15"/>
<path d="M1260 98C1320 135 1365 190 1365 250S1320 365 1260 402C1200 365 1155 310 1155 250S1200 135 1260 98Z" fill="none" stroke="url(#fire)" stroke-width="7" filter="url(#glow)"/>
