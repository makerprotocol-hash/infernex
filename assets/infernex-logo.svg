<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">INFERNEX portal emblem</title><desc id="desc">An original glowing circular portal emblem in crimson and deep orange.</desc>
<defs>
 <radialGradient id="bg"><stop offset="0" stop-color="#240b13"/><stop offset="1" stop-color="#09070b"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ff3b22"/><stop offset=".48" stop-color="#ff7a18"/><stop offset="1" stop-color="#ff244f"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <radialGradient id="core"><stop stop-color="#ff6a25" stop-opacity=".24"/><stop offset="1" stop-color="#120911" stop-opacity=".95"/></radialGradient>
</defs>
<rect width="512" height="512" rx="104" fill="url(#bg)"/>
<circle cx="256" cy="232" r="157" fill="none" stroke="#7d1d29" stroke-width="2" opacity=".5"/>
<circle cx="256" cy="232" r="132" fill="url(#core)" stroke="url(#ring)" stroke-width="13" filter="url(#glow)"/>
<circle cx="256" cy="232" r="108" fill="none" stroke="#ff8b31" stroke-width="2" stroke-dasharray="4 12" opacity=".9"/>
<path d="M256 115 C310 146 337 185 337 232 C337 279 310 318 256 349 C202 318 175 279 175 232 C175 185 202 146 256 115Z" fill="none" stroke="url(#ring)" stroke-width="5" filter="url(#glow)"/>
<path d="M208 232h96M256 184v96" stroke="#ff9a42" stroke-width="3" opacity=".85"/>
<circle cx="256" cy="232" r="19" fill="#ff6a2b" filter="url(#glow)"/>
<path d="M145 390h222" stroke="#ff4b2a" stroke-width="3" opacity=".7"/>
<text x="256" y="435" fill="#fff1e9" font-family="Arial,sans-serif" font-size="39" font-weight="800" letter-spacing="5" text-anchor="middle">INFERNEX</text>
<text x="256" y="465" fill="#ff8a52" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">NATIVE SECURITY ENGINE</text>
